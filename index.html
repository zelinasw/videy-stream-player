<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* GAMBAR 1: TOMBOL BIRU BERSIH TOTAL */
    #step-gate {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .btn-blue {
      width: 100%;
      max-width: 420px;
      padding: 16px 20px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-blue:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* GAMBAR 2: FULLSCREEN PLAYER HITAM BERSIH */
    #step-player {
      display: none;
      width: 100%;
      height: 100%;
      background: #000000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
    }

    /* Tombol Play Bulat Putih Tengah */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      background: #ececec;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
    }

    .center-play-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .triangle-icon {
      width: 0;
      height: 0;
      margin-left: 6px;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 24px solid #111111;
    }
  </style>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <!-- Halaman 1: Tampilan Gate Tombol Biru -->
    <div id="step-gate">
      <button class="btn-blue" id="btn-gate">
        Klik untuk melanjutkan nonton<br>video
      </button>
    </div>

    <!-- Halaman 2: Layar Player Penuh -->
    <div id="step-player">
      <video id="player" playsinline controls controlsList="nodownload"></video>
      <div class="center-play-btn" id="custom-play">
        <div class="triangle-icon"></div>
      </div>
    </div>
  </div>

  <script>
    // GANTI DENGAN KREDENSIAL SUPABASE MILIKMU
    const SUPABASE_URL = "ISI_SUPABASE_URL_KAMU";
    const SUPABASE_ANON_KEY = "ISI_ANON_KEY_KAMU";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const videoParam = params.get('v') || params.get('id');
    const tableParam = params.get('t') || 'videos2'; // Default tabel videos2

    const stepGate = document.getElementById('step-gate');
    const stepPlayer = document.getElementById('step-player');
    const btnGate = document.getElementById('btn-gate');
    const video = document.getElementById('player');
    const customPlay = document.getElementById('custom-play');

    let finalVideoUrl = "";

    async function resolveVideoSource() {
      if (!videoParam) return;

      // 1. Jika input adalah URL lengkap
      if (videoParam.startsWith('http://') || videoParam.startsWith('https://')) {
        finalVideoUrl = videoParam;
        return;
      }

      // 2. Jika input berupa ID Videy langsung (biasanya alfanumerik pendek tanpa strip)
      if (videoParam.length <= 12 && !videoParam.includes('-') && !videoParam.includes(' ')) {
        finalVideoUrl = `https://cdn2.videy.co/${videoParam}.mp4`;
        return;
      }

      // 3. Jika input berupa slug, ambil data dari tabel Supabase
      try {
        const { data, error } = await supabaseClient
          .from(tableParam)
          .select('videy_id')
          .eq('slug', videoParam)
          .maybeSingle();

        if (data && data.videy_id) {
          finalVideoUrl = `https://cdn2.videy.co/${data.videy_id}.mp4`;
        }
      } catch (e) {
        console.error("Gagal mengambil data dari Supabase:", e);
      }
    }

    resolveVideoSource();

    function triggerPopunder() {
      /*
      const script = document.createElement('script');
      script.src = '//url-script-popunder-kamu.com/script.js';
      document.body.appendChild(script);
      */
    }

    // Klik tombol biru
    btnGate.addEventListener('click', () => {
      stepGate.style.display = 'none';
      stepPlayer.style.display = 'block';

      if (finalVideoUrl) {
        video.src = finalVideoUrl;
      }

      triggerPopunder();
    });

    // Kontrol tombol play tengah
    customPlay.addEventListener('click', () => {
      customPlay.style.display = 'none';
      video.play();
    });

    video.addEventListener('pause', () => {
      if (!video.ended) {
        customPlay.style.display = 'flex';
      }
    });

    video.addEventListener('play', () => {
      customPlay.style.display = 'none';
    });
  </script>
</body>
</html>
