<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lanjutkan Menonton</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .btn-blue {
      width: 100%;
      max-width: 420px;
      padding: 16px 20px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn-blue:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-blue" id="btn-redirect">
      Klik untuk melanjutkan nonton<br>video
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoCode = params.get('v') || params.get('to');
    // Membaca target host/domain secara dinamis (default: vlduy.site jika tidak ada ?h=)
    const host = params.get('h') || "vlduy.site";

    document.getElementById('btn-redirect').addEventListener('click', () => {
      if (!videoCode) {
        alert("Tautan video tidak ditemukan atau tidak valid.");
        return;
      }

      // Jika parameter berisi URL lengkap langsung (fallback)
      if (videoCode.startsWith('http://') || videoCode.startsWith('https://')) {
        window.location.href = videoCode;
      } else {
        // Redirect dinamis ke domain tujuan + kode video
        window.location.href = `https://${host}/v/${videoCode}`;
      }
    });
  </script>
</body>
</html>
