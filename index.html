<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lanjutkan Menonton</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .btn-blue {
      width: 100%;
      max-width: 420px;
      padding: 16px 20px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn-blue:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-blue" id="btn-redirect">
      Klik untuk melanjutkan nonton<br>video
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const vParam = params.get('v') || "";

    document.getElementById('btn-redirect').addEventListener('click', () => {
      if (!vParam) {
        alert("Tautan video tidak ditemukan atau tidak valid.");
        return;
      }

      let redirectUrl = "";

      // Membaca awalan digit (1-, 2-, atau 3-)
      if (vParam.startsWith("1-")) {
        const id = vParam.replace("1-", "");
        redirectUrl = `https://vlduy.site/v/${id}`;
      } else if (vParam.startsWith("2-")) {
        const id = vParam.replace("2-", "");
        redirectUrl = `https://slicednlve.site/v/${id}`;
      } else if (vParam.startsWith("3-")) {
        const id = vParam.replace("3-", "");
        redirectUrl = `https://slicednive.site/${id}.mp4`;
      } else {
        // Fallback default jika tanpa awalan angka (ke vlduy.site)
        redirectUrl = `https://vlduy.site/v/${vParam}`;
      }

      window.location.href = redirectUrl;
    });
  </script>
</body>
</html>
