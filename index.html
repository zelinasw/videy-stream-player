<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* GAMBAR 1: TOMBOL BIRU BERSIH TOTAL */
    #step-gate {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px;
    }

    .btn-blue {
      width: 100%;
      max-width: 420px;
      padding: 16px 20px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .btn-blue:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* GAMBAR 2: FULLSCREEN PLAYER HITAM BERSIH */
    #step-player {
      display: none;
      width: 100%;
      height: 100%;
      background: #000000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
    }

    /* Tombol Play Bulat Putih Tengah */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      background: #e6e6e6;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
    }

    .center-play-btn:active {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .triangle-icon {
      width: 0;
      height: 0;
      margin-left: 6px;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 24px solid #111111;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Halaman 1: Tampilan Gate Tombol Biru -->
    <div id="step-gate">
      <button class="btn-blue" id="btn-gate">
        Klik untuk melanjutkan nonton<br>video
      </button>
    </div>

    <!-- Halaman 2: Layar Player Penuh (Persis Gambar 2) -->
    <div id="step-player">
      <video id="player" playsinline controls controlsList="nodownload"></video>
      <div class="center-play-btn" id="custom-play">
        <div class="triangle-icon"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let videoUrl = params.get('v');

    const stepGate = document.getElementById('step-gate');
    const stepPlayer = document.getElementById('step-player');
    const btnGate = document.getElementById('btn-gate');
    const video = document.getElementById('player');
    const customPlay = document.getElementById('custom-play');

    // Decode Base64 jika URL video terenkripsi
    if (videoUrl) {
      try {
        if (!videoUrl.startsWith('http')) {
          videoUrl = atob(videoUrl);
        }
      } catch (e) {}
    }

    // Fungsi load script iklan popunder (hanya dipanggil setelah klik)
    function triggerPopunder() {
      // TEMPEL LINK SCRIPT IKLAN POPUNDER KAMU DI BAWAH INI (OPSIONAL):
      /*
      const script = document.createElement('script');
      script.src = '//url-script-popunder-kamu.com/script.js';
      document.body.appendChild(script);
      */
    }

    // Klik tombol biru (Pindah ke Player Fullscreen)
    btnGate.addEventListener('click', () => {
      stepGate.style.display = 'none';
      stepPlayer.style.display = 'block';

      if (videoUrl) {
        video.src = videoUrl;
      }

      // Jalankan iklan saat tombol ditekan
      triggerPopunder();
    });

    // Kontrol tombol play bulat putih
    customPlay.addEventListener('click', () => {
      customPlay.style.display = 'none';
      video.play();
    });

    video.addEventListener('pause', () => {
      if (!video.ended) {
        customPlay.style.display = 'flex';
      }
    });

    video.addEventListener('play', () => {
      customPlay.style.display = 'none';
    });
  </script>
</body>
</html>
