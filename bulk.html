<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Sharelink Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 900px; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 6px; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 18px; }

    .control-panel {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    select, button {
      padding: 8px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    select { cursor: pointer; }
    button {
      background: #0284c7;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #0369a1; }
    .btn-green { background: #16a34a; }
    .btn-green:hover { background: #15803d; }

    .table-container {
      background: #1e293b;
      border-radius: 8px;
      overflow-x: auto;
      max-height: 420px;
      border: 1px solid #334155;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
    th, td { padding: 10px 14px; border-bottom: 1px solid #334155; }
    th { background: #0f172a; position: sticky; top: 0; color: #94a3b8; }
    tr:hover { background: #283548; }

    .result-box {
      margin-top: 18px;
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #38bdf8;
      font-family: monospace;
      padding: 10px;
      border-radius: 6px;
      resize: vertical;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bulk Sharelink Selector</h1>
    <p>Pilih tabel, klik tampilkan data, centang video, lalu generate link siap share.</p>

    <div class="control-panel">
      <label for="table-select">Tabel:</label>
      <select id="table-select">
        <option value="videos2" selected>videos2</option>
        <option value="videos1">videos1</option>
      </select>

      <button onclick="fetchVideos()">Tampilkan Video</button>
      <button class="btn-green" onclick="generateBulkLinks()">Generate Link Terpilih</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th width="40"><input type="checkbox" id="check-all" onclick="toggleSelectAll(this)" /></th>
            <th>ID</th>
            <th>Judul</th>
            <th>Videy ID</th>
            <th>Slug</th>
          </tr>
        </thead>
        <tbody id="video-list">
          <tr>
            <td colspan="5" style="text-align:center; color:#64748b; padding: 24px;">
              Klik tombol "Tampilkan Video" untuk memuat data.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="result-box">
      <label>Link Hasil Generate:</label>
      <textarea id="result-links" readonly placeholder="Link yang dicentang akan keluar di sini..."></textarea>
      <button class="btn-green" style="margin-top:8px;" onclick="copyLinks()">Salin Semua Link</button>
    </div>
  </div>

  <script>
    async function fetchVideos() {
      const table = document.getElementById('table-select').value;
      const tbody = document.getElementById('video-list');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Memuat data...</td></tr>';

      try {
        const res = await fetch(`/api/list?t=${table}`);
        const data = await res.json();

        if (!Array.isArray(data)) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171; padding:20px;">Error: ${data.error || 'Gagal memuat'}</td></tr>`;
          return;
        }

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Tabel kosong.</td></tr>';
          return;
        }

        tbody.innerHTML = data.map(item => `
          <tr>
            <td><input type="checkbox" class="video-check" value="${item.videy_id}" data-slug="${item.slug || ''}"></td>
            <td>${item.id}</td>
            <td>${item.title || '-'}</td>
            <td><code>${item.videy_id}</code></td>
            <td>${item.slug || '-'}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171; padding:20px;">Gagal memuat data.</td></tr>`;
      }
    }

    function toggleSelectAll(master) {
      document.querySelectorAll('.video-check').forEach(cb => cb.checked = master.checked);
    }

    function generateBulkLinks() {
      const selected = document.querySelectorAll('.video-check:checked');
      if (selected.length === 0) return alert('Centang minimal 1 video terlebih dahulu.');

      const origin = window.location.origin;
      const links = Array.from(selected).map(cb => {
        const target = cb.dataset.slug ? cb.dataset.slug : cb.value;
        return `${origin}/?v=${target}`;
      });

      document.getElementById('result-links').value = links.join('\n');
    }

    function copyLinks() {
      const output = document.getElementById('result-links');
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      alert('Semua link berhasil disalin!');
    }
  </script>
</body>
</html>
