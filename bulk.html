<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge Link Generator - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 1080px;
    }
    header { margin-bottom: 24px; }
    h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 6px; }
    p { font-size: 0.88rem; color: #94a3b8; }

    .control-panel {
      background: #1e293b;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #334155;
    }
    .control-panel label { font-size: 0.9rem; font-weight: 600; color: #f8fafc; }
    .control-panel select {
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }
    .card label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    textarea {
      width: 100%;
      height: 320px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }
    #output-links { color: #38bdf8; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-convert { background: #0284c7; color: #fff; }
    .btn-copy { background: #16a34a; color: #fff; }
    .btn-clear { background: #475569; color: #fff; flex: 0.4; }

    .status-badge {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>Bridge Cloaker Dashboard</h1>
      <p>Pilih target domain player tujuan, tempel link asli, lalu generate link jembatan siap share.</p>
    </header>

    <!-- PILIHAN 4 DOMAIN -->
    <div class="control-panel">
      <label for="target-domain">Target Domain Tujuan:</label>
      <select id="target-domain">
        <option value="1">1. vlduy.site (/v/ID)</option>
        <option value="2">2. slicednlve.site (/v/ID)</option>
        <option value="3">3. slicednive.site (/ID.mp4)</option>
        <option value="4">4. vidco.site (/ID.mp4)</option>
      </select>
    </div>

    <div class="grid-layout">
      <!-- KOLOM 1: INPUT LINK ASLI -->
      <div class="card">
        <label for="input-links">Kolom 1: Link Tujuan Asli (1 link per baris)</label>
        <textarea id="input-links" placeholder="https://vlduy.site/v/kMKUjfQF1&#10;https://slicednlve.site/v/gT02uUUA1&#10;https://slicednive.site/5kHoJKq51.mp4&#10;https://vidco.site/0U7TGpzO1.mp4"></textarea>
        <div class="actions">
          <button class="btn-clear" onclick="clearInput()">Reset</button>
          <button class="btn-convert" onclick="generateBridgeLinks()">Generate Link ➔</button>
        </div>
        <div class="status-badge" id="input-count">Total link input: 0</div>
      </div>

      <!-- KOLOM 2: OUTPUT LINK JEMBATAN -->
      <div class="card">
        <label for="output-links">Kolom 2: Hasil Link Jembatan (Siap Sebar)</label>
        <textarea id="output-links" readonly placeholder="Link hasil generate akan muncul otomatis di sini..."></textarea>
        <div class="actions">
          <button class="btn-copy" onclick="copyResults()">Salin Semua Link</button>
        </div>
        <div class="status-badge" id="output-count">Total link hasil: 0</div>
      </div>
    </div>
  </div>

  <script>
    function generateBridgeLinks() {
      const input = document.getElementById('input-links').value.trim();
      if (!input) return alert('Silakan masukkan minimal 1 tautan.');

      const targetDomainType = document.getElementById('target-domain').value;
      const lines = input.split('\n');
      const origin = window.location.origin;

      const results = lines
        .map(url => url.trim())
        .filter(url => url.length > 0)
        .map(url => {
          let clean = url.replace(/\/+$/, '').replace(/\.mp4$/i, '');
          const code = clean.substring(clean.lastIndexOf('/') + 1);
          return `${origin}/?v=${targetDomainType}-${code}`;
        });

      document.getElementById('output-links').value = results.join('\n');
      document.getElementById('input-count').textContent = `Total link input: ${lines.filter(l => l.trim()).length}`;
      document.getElementById('output-count').textContent = `Total link hasil: ${results.length}`;
    }

    function copyResults() {
      const outputArea = document.getElementById('output-links');
      if (!outputArea.value) return;
      outputArea.select();
      navigator.clipboard.writeText(outputArea.value);
      alert('Semua link jembatan berhasil disalin!');
    }

    function clearInput() {
      document.getElementById('input-links').value = '';
      document.getElementById('output-links').value = '';
      document.getElementById('input-count').textContent = 'Total link input: 0';
      document.getElementById('output-count').textContent = 'Total link hasil: 0';
    }
  </script>
</body>
</html>
